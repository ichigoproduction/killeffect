name: Swap Void and Ender

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/swap-void-ender.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Swap Void and Ender implementations
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/client/java/dose/killeffect/client/KillEffect.java')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Patch anchor not found:\n{old}')
              s = s.replace(old, new, 1)

          # Rename the tuning blocks so internal names match the swapped effects.
          replace_once(
              '''    // ===== Void tuning =====\n    private static final DustParticleEffect VOID_PURPLE = new DustParticleEffect(0x7137FF, 1.15f);\n    private static final DustParticleEffect VOID_DARK = new DustParticleEffect(0x21002E, 1.25f);\n    private static final int VOID_PARTICLES = 52;''',
              '''    // ===== Ender tuning =====\n    private static final DustParticleEffect ENDER_SIMPLE_PURPLE = new DustParticleEffect(0x7137FF, 1.15f);\n    private static final DustParticleEffect ENDER_SIMPLE_DARK = new DustParticleEffect(0x21002E, 1.25f);\n    private static final int ENDER_SIMPLE_PARTICLES = 52;'''
          )

          replace_once(
              '''    // ===== Ender / black-hole tuning =====\n    private static final DustParticleEffect ENDER_PURPLE = new DustParticleEffect(0x8E44FF, 0.95f);\n    private static final DustParticleEffect ENDER_DARK = new DustParticleEffect(0x17001F, 1.20f);\n    private static final long ENDER_DURATION_MS = 650;\n    private static final int ENDER_PARTICLES_PER_TICK = 24;\n    private static final double ENDER_MAX_RADIUS = 2.15;\n    private static int enderSeq = 1;''',
              '''    // ===== Void / black-hole tuning =====\n    private static final DustParticleEffect VOID_PURPLE = new DustParticleEffect(0x8E44FF, 0.95f);\n    private static final DustParticleEffect VOID_DARK = new DustParticleEffect(0x17001F, 1.20f);\n    private static final long VOID_DURATION_MS = 650;\n    private static final int VOID_PARTICLES_PER_TICK = 24;\n    private static final double VOID_MAX_RADIUS = 2.15;\n    private static int voidSeq = 1;'''
          )

          replace_once(
              '''            if (q.equals("void")) return VOID;\n            if (q.equals("freeze") || q.equals("ice")) return FREEZE;\n            if (q.equals("ender") || q.equals("blackhole") || q.equals("black_hole")) return ENDER;''',
              '''            if (q.equals("void") || q.equals("blackhole") || q.equals("black_hole")) return VOID;\n            if (q.equals("freeze") || q.equals("ice")) return FREEZE;\n            if (q.equals("ender")) return ENDER;'''
          )

          # Old simple Void implementation becomes Ender.
          simple_start = s.index('    private static void spawnVoid(ClientWorld world, Vec3d pos) {')
          simple_end = s.index('    private static void spawnFreeze', simple_start)
          simple = s[simple_start:simple_end]
          simple = simple.replace('spawnVoid', 'spawnEnder', 1)
          simple = simple.replace('VOID_PARTICLES', 'ENDER_SIMPLE_PARTICLES')
          simple = simple.replace('VOID_DARK', 'ENDER_SIMPLE_DARK')
          simple = simple.replace('VOID_PURPLE', 'ENDER_SIMPLE_PURPLE')
          s = s[:simple_start] + simple + s[simple_end:]

          # Old animated Ender implementation becomes Void.
          animated_start = s.index('    private static void spawnEnder(ClientWorld world, Vec3d pos, long nowMs) {')
          animated_end = s.index('    private static void spawnRose', animated_start)
          animated = s[animated_start:animated_end]
          animated = animated.replace('spawnEnder', 'spawnVoid', 1)
          animated = animated.replace('enderSeq', 'voidSeq')
          animated = animated.replace('enderBursts', 'voidBursts')
          animated = animated.replace('EnderBurst', 'VoidBurst')
          animated = animated.replace('ENDER_DURATION_MS', 'VOID_DURATION_MS')
          animated = animated.replace('ENDER_PARTICLES_PER_TICK', 'VOID_PARTICLES_PER_TICK')
          animated = animated.replace('ENDER_MAX_RADIUS', 'VOID_MAX_RADIUS')
          animated = animated.replace('ENDER_DARK', 'VOID_DARK')
          animated = animated.replace('ENDER_PURPLE', 'VOID_PURPLE')
          animated = animated.replace('tickEnderBursts', 'tickVoidBursts')
          animated = animated.replace('emitEnderFrame', 'emitVoidFrame')
          animated = animated.replace('finishEnder', 'finishVoid')
          s = s[:animated_start] + animated + s[animated_end:]

          # Tracking state belongs to the new Void black-hole effect.
          s = s.replace('// ===== Ender black-hole tracking =====', '// ===== Void black-hole tracking =====')
          s = s.replace('Map<Integer, EnderBurst> enderBursts', 'Map<Integer, VoidBurst> voidBursts')
          s = s.replace('private static final class EnderBurst', 'private static final class VoidBurst')
          s = s.replace('EnderBurst(int id, Vec3d basePos, long startMs, long endMs)', 'VoidBurst(int id, Vec3d basePos, long startMs, long endMs)')
          s = s.replace('tickEnderBursts(world, nowMs);', 'tickVoidBursts(world, nowMs);')

          # Public mapping is swapped: Void = black hole, Ender = short purple collapse.
          replace_once(
              '''        else if (type == EffectType.VOID) spawnVoid(world, pos);\n        else if (type == EffectType.FREEZE) spawnFreeze(world, pos);\n        else if (type == EffectType.ENDER) spawnEnder(world, pos, nowMs);''',
              '''        else if (type == EffectType.VOID) spawnVoid(world, pos, nowMs);\n        else if (type == EffectType.FREEZE) spawnFreeze(world, pos);\n        else if (type == EffectType.ENDER) spawnEnder(world, pos);'''
          )

          path.write_text(s, encoding='utf-8')

      - name: Build
        run: gradle build --stacktrace

      - name: Commit swap
        run: |
          git config user.name "ichigoproduction"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/java/dose/killeffect/client/KillEffect.java
          git commit -m "Swap Void and Ender kill effects"
          git push origin HEAD:master
