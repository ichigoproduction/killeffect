name: Wire Beautiful Kill Effects

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/wire-beautiful-effects.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Wire effects into KillEffect
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/client/java/dose/killeffect/client/KillEffect.java')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Patch anchor not found:\n{old}')
              s = s.replace(old, new, 1)

          replace_once(
              'package dose.killeffect.client;\n\n',
              'package dose.killeffect.client;\n\n'
              'import dose.killeffect.client.effects.AuroraEffect;\n'
              'import dose.killeffect.client.effects.ButterflyEffect;\n'
              'import dose.killeffect.client.effects.LotusEffect;\n'
              'import dose.killeffect.client.effects.MoonlightEffect;\n'
              'import dose.killeffect.client.effects.StarlightEffect;\n\n'
          )

          replace_once(
              '''        ENDER,\n        ROSE;''',
              '''        ENDER,\n        ROSE,\n        AURORA,\n        STARLIGHT,\n        BUTTERFLY,\n        MOONLIGHT,\n        LOTUS;'''
          )

          replace_once(
              '''            if (q.equals("ender")) return ENDER;\n            if (q.equals("rose")) return ROSE;\n            return null;''',
              '''            if (q.equals("ender")) return ENDER;\n            if (q.equals("rose")) return ROSE;\n            if (q.equals("aurora")) return AURORA;\n            if (q.equals("starlight") || q.equals("star")) return STARLIGHT;\n            if (q.equals("butterfly") || q.equals("butterflies")) return BUTTERFLY;\n            if (q.equals("moonlight") || q.equals("moon")) return MOONLIGHT;\n            if (q.equals("lotus")) return LOTUS;\n            return null;'''
          )

          replace_once(
              '''                            .then(ClientCommandManager.literal("rose").executes(ctx -> {\n                                effect = EffectType.ROSE;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.argument("effect", StringArgumentType.word())''',
              '''                            .then(ClientCommandManager.literal("rose").executes(ctx -> {\n                                effect = EffectType.ROSE;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.literal("aurora").executes(ctx -> {\n                                effect = EffectType.AURORA;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.literal("starlight").executes(ctx -> {\n                                effect = EffectType.STARLIGHT;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.literal("butterfly").executes(ctx -> {\n                                effect = EffectType.BUTTERFLY;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.literal("moonlight").executes(ctx -> {\n                                effect = EffectType.MOONLIGHT;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.literal("lotus").executes(ctx -> {\n                                effect = EffectType.LOTUS;\n                                saveConfig();\n                                send(statusLine());\n                                return 1;\n                            }))\n                            .then(ClientCommandManager.argument("effect", StringArgumentType.word())'''
          )

          replace_once(
              'supported: thunder, totem, wing, potion, soul, blood, explosion, void, freeze, ender, rose)',
              'supported: thunder, totem, wing, potion, soul, blood, explosion, void, freeze, ender, rose, aurora, starlight, butterfly, moonlight, lotus)'
          )

          replace_once(
              '''        else if (type == EffectType.ENDER) spawnEnder(world, pos);\n        else if (type == EffectType.ROSE) spawnRose(world, pos);\n    }''',
              '''        else if (type == EffectType.ENDER) spawnEnder(world, pos);\n        else if (type == EffectType.ROSE) spawnRose(world, pos);\n        else if (type == EffectType.AURORA) AuroraEffect.spawn(world, pos);\n        else if (type == EffectType.STARLIGHT) StarlightEffect.spawn(world, pos);\n        else if (type == EffectType.BUTTERFLY) ButterflyEffect.spawn(world, pos);\n        else if (type == EffectType.MOONLIGHT) MoonlightEffect.spawn(world, pos);\n        else if (type == EffectType.LOTUS) LotusEffect.spawn(world, pos);\n    }'''
          )

          path.write_text(s, encoding='utf-8')

      - name: Build
        run: gradle build --stacktrace

      - name: Commit wiring
        run: |
          git config user.name "ichigoproduction"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/java/dose/killeffect/client/KillEffect.java
          git commit -m "Wire five beautiful kill effects"
          git push origin HEAD:master
